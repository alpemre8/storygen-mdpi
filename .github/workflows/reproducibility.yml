name: Scientific reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  numeric-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python tools/reproduce.py verify
      - run: python tools/audit_public.py
      - run: python tools/reproduce.py reproduce --output reproduced
      - run: python -m pytest -q
