[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storygen-platform"
version = "0.1.0"
description = "Provenance-first StoryGen experiment orchestration"
requires-python = ">=3.12"
dependencies = ["PyYAML", "jsonschema", "packaging", "httpx", "numpy", "scipy", "jinja2"]

[project.scripts]
storygen = "storygen_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
